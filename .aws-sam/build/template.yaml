  DailySocialPosterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AppName}-daily-social-poster
      CodeUri: DailySocialPosterFunction
      Handler: lambda_functions.postDailySocials
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 3 * * ? *)
            Name: DailySocialPosterSchedule
            Description: Triggers daily at 9:00 AM IST to post to socials
            Enabled: true
      Tags:
        Environment:
          Ref: Environment
    Metadata:
      SamResourceId: DailySocialPosterFunction
  UserRecordingsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${AppName}-recordings-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - '*'
          AllowedMethods:
          - GET
          - PUT
          - POST
          - DELETE
          - HEAD
          AllowedOrigins:
          - Fn::Sub: https://${DomainName}
          - http://localhost:5173
          - http://localhost:3000
          ExposedHeaders:
          - ETag
          MaxAge: 3600
      Tags:
      - Key: Environment
        Value:
          Ref: Environment
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${AppName}-lambda-errors
      AlarmDescription: Alert when Lambda functions error
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/apigateway/${AppName}
      RetentionInDays: 30
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name:
        Fn::Sub: ${AppName}-api-endpoint
  GetSongFunctionArn:
    Description: ARN of getSongOfDay Lambda function
    Value:
      Fn::GetAtt:
      - GetSongOfDayFunction
      - Arn
  ScheduleSongFunctionArn:
    Description: ARN of scheduleSong Lambda function
    Value:
      Fn::GetAtt:
      - ScheduleSongFunction
      - Arn
