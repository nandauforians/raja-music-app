# ============================================================================
# AWS SAM TEMPLATE FOR ILAYARAJA DAILY MUSIC APP
# Deploy with: sam deploy --guided
# ============================================================================

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: 'Ilayaraja Daily Music Discovery App - Serverless Infrastructure'

Parameters:
  AppName:
    Type: String
    Default: ilayaraja-app
    Description: Application name for resource naming
  
  AdminApiKey:
    Type: String
    NoEcho: true
    Description: Secret API key for admin endpoints
  
  SpotifyClientId:
    Type: String
    NoEcho: true
    Default: ""
    Description: Spotify Client ID for search API
    
  SpotifyClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Spotify Client Secret for search API
    
  GoogleClientId:
    Type: String
    Default: ""
    Description: Google Client ID for Admin OAuth
    
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Gemini API Key for dynamic song trivia
    
  MongoDbUri:
    Type: String
    NoEcho: true
    Description: MongoDB Atlas Connection URI
  
  DomainName:
    Type: String
    Default: music.uforiansports.com
    Description: Domain name for CORS
  
  CloudFrontPrivateKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Private key for signing CloudFront URLs
  
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]
    Description: Environment name

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs20.x
    Environment:
      Variables:
        MONGODB_URI: !Ref MongoDbUri
        ADMIN_API_KEY: !Ref AdminApiKey
        DOMAIN_NAME: !Ref DomainName
        NODE_ENV: !Ref Environment
        GOOGLE_CLIENT_ID: !Ref GoogleClientId
        GEMINI_API_KEY: !Ref GeminiApiKey
        CLOUDFRONT_KEY_PAIR_ID: !Ref AudioCloudFrontPublicKey
        CLOUDFRONT_PRIVATE_KEY: !Ref CloudFrontPrivateKey


Resources:
  # ========================================================================
  # API GATEWAY
  # ========================================================================

  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${AppName}-api'
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,OPTIONS,DELETE,PUT,PATCH'"
        AllowHeaders: "'Content-Type,Authorization,x-user-id'"
        AllowOrigin: "'*'"
        MaxAge: "'3600'"

  # ========================================================================
  # LAMBDA FUNCTIONS
  # ========================================================================

  GetSongOfDayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-get-song-of-day'
      CodeUri: backend/
      Handler: lambda_functions.getSongOfDay
      Events:
        GetSongApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /song/today
            Method: GET
      Tags:
        Environment: !Ref Environment

  GetArchiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-get-archive'
      CodeUri: backend/
      Handler: lambda_functions.getArchive
      Events:
        GetArchiveApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /song/archive
            Method: GET
      Tags:
        Environment: !Ref Environment

  ScoreVocalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-score-vocal'
      CodeUri: backend/
      Handler: lambda_functions.scoreVocal
      Events:
        ScoreVocalApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /song/score
            Method: POST
      Tags:
        Environment: !Ref Environment

  ScheduleSongFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-schedule-song'
      CodeUri: backend/
      Handler: lambda_functions.scheduleSong
      Events:
        ScheduleSongApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/schedule
            Method: POST
      Tags:
        Environment: !Ref Environment

  ListScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-list-schedule'
      CodeUri: backend/
      Handler: lambda_functions.listSchedule
      Events:
        ListScheduleApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/schedule
            Method: GET
      Tags:
        Environment: !Ref Environment

  GetSongListFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-get-song-list'
      CodeUri: backend/
      Handler: lambda_functions.getSongList
      Events:
        GetSongListApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /songs/list
            Method: GET
      Tags:
        Environment: !Ref Environment

  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-health'
      CodeUri: backend/
      Handler: lambda_functions.health
      Events:
        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /health
            Method: GET
      Tags:
        Environment: !Ref Environment

  SeedDatabaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-seed-database'
      CodeUri: backend/
      Handler: lambda_functions.seedDatabase
      Tags:
        Environment: !Ref Environment

  ResetScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-reset-schedule'
      CodeUri: backend/
      Handler: lambda_functions.resetSchedule
      Tags:
        Environment: !Ref Environment

  AddSongFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-add-song'
      CodeUri: backend/
      Handler: lambda_functions.addSong
      Events:
        AddSongApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/songs
            Method: POST
      Tags:
        Environment: !Ref Environment

  UpdateSongFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-update-song'
      CodeUri: backend/
      Handler: lambda_functions.updateSong
      Events:
        UpdateSongApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/songs/{id}
            Method: PATCH
      Tags:
        Environment: !Ref Environment

  SearchYouTubeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-search-youtube'
      CodeUri: backend/
      Handler: lambda_functions.searchYouTube
      Events:
        SearchYouTubeApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/youtube-search
            Method: GET
      Tags:
        Environment: !Ref Environment

  UserPreferencesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-user-preferences'
      CodeUri: backend/
      Handler: lambda_functions.getUserPreferences
      Events:
        GetApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user/preferences
            Method: GET
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user/preferences
            Method: POST
      Tags:
        Environment: !Ref Environment

  SaveUserPreferencesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-save-user-preferences'
      CodeUri: backend/
      Handler: lambda_functions.saveUserPreferences
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user/preferences
            Method: POST
      Tags:
        Environment: !Ref Environment

  SuggestSongFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-suggest-song'
      CodeUri: backend/
      Handler: lambda_functions.suggestSong
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /suggestions
            Method: POST
      Tags:
        Environment: !Ref Environment

  GetAdminSuggestionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-get-admin-suggestions'
      CodeUri: backend/
      Handler: lambda_functions.getAdminSuggestions
      Events:
        GetApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/suggestions
            Method: GET
      Tags:
        Environment: !Ref Environment

  ApproveSuggestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-approve-suggestion'
      CodeUri: backend/
      Handler: lambda_functions.approveSuggestion
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/suggestions/{id}/approve
            Method: POST
      Tags:
        Environment: !Ref Environment

  RejectSuggestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-reject-suggestion'
      CodeUri: backend/
      Handler: lambda_functions.rejectSuggestion
      Events:
        PostApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/suggestions/{id}/reject
            Method: POST
      Tags:
        Environment: !Ref Environment

  RemoveSongFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-remove-song'
      CodeUri: backend/
      Handler: lambda_functions.removeSong
      Events:
        RemoveSongApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/songs/{id}
            Method: DELETE
      Tags:
        Environment: !Ref Environment

  UpdateKaraokeUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-update-karaoke-url'
      CodeUri: backend/
      Handler: lambda_functions.updateKaraokeUrl
      Events:
        UpdateKaraokeUrlApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/songs/{id}/karaoke
            Method: PATCH
      Tags:
        Environment: !Ref Environment

  GetKaraokeUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-get-karaoke-upload-url'
      CodeUri: backend/
      Handler: lambda_functions.getKaraokeUploadUrl
      Events:
        GetKaraokeUploadUrlApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/karaoke-upload-url
            Method: GET
      Tags:
        Environment: !Ref Environment

  SearchSpotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-search-spotify'
      CodeUri: backend/
      Handler: lambda_functions.searchSpotify
      Environment:
        Variables:
          SPOTIFY_CLIENT_ID: !Ref SpotifyClientId
          SPOTIFY_CLIENT_SECRET: !Ref SpotifyClientSecret
      Events:
        SearchSpotifyApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/search
            Method: GET
      Tags:
        Environment: !Ref Environment

  GetLeaderboardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-leaderboards'
      CodeUri: backend/
      Handler: lambda_functions.getLeaderboards
      Events:
        LeaderboardsApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /users/rankings
            Method: GET
      Tags:
        Environment: !Ref Environment

  TrackActivityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-track-activity'
      CodeUri: backend/
      Handler: lambda_functions.trackActivity
      Events:
        TrackActivityApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /activity/track
            Method: POST
      Tags:
        Environment: !Ref Environment

  TrackPlaybackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-track-playback'
      CodeUri: backend/
      Handler: lambda_functions.trackPlayback
      Events:
        TrackPlaybackApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /song/track-playback
            Method: POST
      Tags:
        Environment: !Ref Environment

  RateSongFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-rate-song'
      CodeUri: backend/
      Handler: lambda_functions.rateSong
      Events:
        RateSongApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /rate
            Method: POST
      Tags:
        Environment: !Ref Environment

  GetUserRatingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-get-user-rating'
      CodeUri: backend/
      Handler: lambda_functions.getUserRating
      Events:
        GetUserRatingApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /song/rating
            Method: GET
      Tags:
        Environment: !Ref Environment

  GetTopRatedSongsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-get-top-rated-songs'
      CodeUri: backend/
      Handler: lambda_functions.getTopRatedSongs
      Events:
        GetTopRatedSongsApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /songs/top-rated
            Method: GET
      Tags:
        Environment: !Ref Environment

  SaveRecordingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-save-recording'
      CodeUri: backend/
      Handler: lambda_functions.saveRecording
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref UserRecordingsBucket
      Environment:
        Variables:
          RECORDINGS_BUCKET: !Ref UserRecordingsBucket
      Events:
        SaveRecordingApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /song/recording/save
            Method: POST
      Tags:
        Environment: !Ref Environment

  GetUserRecordingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-get-user-recordings'
      CodeUri: backend/
      Handler: lambda_functions.getUserRecordings
      Environment:
        Variables:
          RECORDINGS_BUCKET: !Ref UserRecordingsBucket
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref UserRecordingsBucket
      Events:
        GetUserRecordingsApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user/recordings
            Method: GET
      Tags:
        Environment: !Ref Environment

  UserStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-user-stats'
      CodeUri: backend/
      Handler: lambda_functions.getUserStats
      Environment:
        Variables:
          RECORDINGS_BUCKET: !Ref UserRecordingsBucket
      Events:
        UserStatsApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user/stats
            Method: GET
      Tags:
        Environment: !Ref Environment

  AdminGamificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-admin-gamification'
      CodeUri: backend/
      Handler: lambda_functions.getAdminGamification
      Events:
        AdminGamificationApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/gamification
            Method: GET
      Tags:
        Environment: !Ref Environment

  UserProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-user-profile'
      CodeUri: backend/
      Handler: lambda_functions.updateUserProfile
      Events:
        UserProfileApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /user/profile
            Method: POST
      Tags:
        Environment: !Ref Environment

  AdminPayoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-admin-payout'
      CodeUri: backend/
      Handler: lambda_functions.adminPayout
      Events:
        AdminPayoutApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/payout
            Method: POST
      Tags:
        Environment: !Ref Environment

  RequestIncentiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-request-incentive'
      CodeUri: backend/
      Handler: lambda_functions.requestIncentive
      Events:
        RequestIncentiveApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /incentive/request
            Method: POST
      Tags:
        Environment: !Ref Environment

  GetIncentiveRequestsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-get-incentive-requests'
      CodeUri: backend/
      Handler: lambda_functions.getIncentiveRequests
      Events:
        GetIncentiveRequestsApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/incentives
            Method: GET
      Tags:
        Environment: !Ref Environment

  ApproveIncentiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-approve-incentive'
      CodeUri: backend/
      Handler: lambda_functions.approveIncentive
      Events:
        ApproveIncentiveApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/incentives/approve
            Method: POST
      Tags:
        Environment: !Ref Environment

  RejectIncentiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-reject-incentive'
      CodeUri: backend/
      Handler: lambda_functions.rejectIncentive
      Events:
        RejectIncentiveApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/incentives/reject
            Method: POST
      Tags:
        Environment: !Ref Environment

  # ========================================================================
  # S3 BUCKET FOR USER RECORDINGS
  # ========================================================================
  
  UserRecordingsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AppName}-recordings-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - !Sub 'https://${DomainName}'
              - 'http://localhost:5173'
              - 'http://localhost:3000'
            ExposedHeaders:
              - ETag
            MaxAge: 3600
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ========================================================================
  # S3 BUCKET FOR FRONTEND
  # ========================================================================

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AppName}-frontend-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ========================================================================
  # CLOUDFRONT DISTRIBUTION
  # ========================================================================

  AudioCloudFrontPublicKey:
    Type: AWS::CloudFront::PublicKey
    Properties:
      PublicKeyConfig:
        CallerReference: 'audio-public-key'
        EncodedKey: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAx1fFz1Pcw+WQZcKpaks4
          P2WEY8xcEjsY3xDzfmNn+EPcTy5k4F9MqQjqh0OO85y2txCNKDRdpoPjEKfExGzU
          jM9tPKqLi23O5pvO4rUFPL3bBHmdJP3HD4ch7B/LJ4OWWUzx4wvQQ3HhM1epBXMH
          xgdnR4WsOMzz9BFXv4/xptcdrATbt3TRNr6CbvW4wAhs/isDre5fbGP6IbjuA3rF
          xxsLqTrcrDQpDW1Z9zVOhxasD8flGdUymLWJ50VveMm/BwYa0L40QX+Tb0btas3y
          Fzsr6SiYc+E2T/9DG6RhOQx5ZzT3UrOLbpDuDiTCkkME1nYungkNNox3Ie+5x7Hy
          3wIDAQAB
          -----END PUBLIC KEY-----
        Name: audio-public-key

  AudioKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Properties:
      KeyGroupConfig:
        Name: audio-key-group
        Items:
          - !Ref AudioCloudFrontPublicKey

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        Comment: !Sub '${AppName} CDN'
        Aliases:
          - music.uforiansports.com
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:274345729498:certificate/284e3f32-bd69-4157-a0c8-7fa00562679a
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultCacheBehavior:
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          TargetOriginId: FrontendOrigin
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
        CacheBehaviors:
          - PathPattern: '*.mp3'
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            TargetOriginId: AudioOrigin
            TrustedKeyGroups:
              - !Ref AudioKeyGroup
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
          - PathPattern: 'source/*'
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            TargetOriginId: AudioOrigin
            TrustedKeyGroups:
              - !Ref AudioKeyGroup
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
          - PathPattern: '/index.html'
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            TargetOriginId: FrontendOrigin
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
        Origins:
          - Id: FrontendOrigin
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${CloudFrontOAI}'
            DomainName: !GetAtt FrontendBucket.DomainName
          - Id: AudioOrigin
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${CloudFrontOAI}'
            DomainName: uforian-karaoke-tracks.s3.amazonaws.com
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
      Tags:
        - Key: Environment
          Value: !Ref Environment

  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub 'OAI for ${AppName}'

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${CloudFrontOAI}'
            Action: 's3:GetObject'
            Resource: !Sub '${FrontendBucket.Arn}/*'

  # ========================================================================
  # CLOUDWATCH ALARMS
  # ========================================================================

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AppName}-lambda-errors'
      AlarmDescription: Alert when Lambda functions error
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ========================================================================
  # LOG GROUPS
  # ========================================================================

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AppName}'
      RetentionInDays: 30


Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AppName}-api-endpoint'

  FrontendBucketName:
    Description: S3 bucket for frontend deployment
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${AppName}-bucket'

  CloudFrontDomain:
    Description: CloudFront distribution domain
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub '${AppName}-cdn-domain'

