version: '3.8'

services:
  metube:
    image: alexta69/metube
    container_name: metube
    restart: unless-stopped
    ports:
      - "8090:8081"
    volumes:
      - ../../karaoke_source:/downloads
    environment:
      # Download audio only as MP3
      - YTDL_OPTIONS={"format":"bestaudio/best","postprocessors":[{"key":"FFmpegExtractAudio","preferredcodec":"mp3","preferredquality":"320"}],"outtmpl":"%(title)s.%(ext)s"}
      # Default to audio-only mode in the UI
      - DEFAULT_THEME=dark
