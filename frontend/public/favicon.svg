<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#271c19" />
    </linearGradient>
    <linearGradient id="note-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" />
  
  <!-- Outer Ring (Vinyl feel) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#3f3f46" stroke-width="8" opacity="0.5" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#52525b" stroke-width="4" opacity="0.3" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#71717a" stroke-width="2" opacity="0.2" />

  <!-- Center Accent -->
  <circle cx="256" cy="256" r="180" fill="#a855f7" opacity="0.05" filter="url(#glow)" />

  <!-- Music Note (Classic Double Eighth Note) -->
  <g fill="url(#note-grad)" filter="url(#glow)">
    <!-- Note stems -->
    <rect x="200" y="150" width="24" height="180" rx="4" />
    <rect x="320" y="130" width="24" height="180" rx="4" />
    
    <!-- Top beam -->
    <path d="M 200 150 L 344 130 L 344 160 L 200 180 Z" />
    
    <!-- Note heads -->
    <ellipse cx="176" cy="330" rx="48" ry="32" transform="rotate(-15 176 330)" />
    <ellipse cx="296" cy="310" rx="48" ry="32" transform="rotate(-15 296 310)" />
  </g>
  
  <!-- Highlight reflection -->
  <ellipse cx="256" cy="80" rx="150" ry="20" fill="#ffffff" opacity="0.03" />
</svg>