AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ilayaraja Daily Music Discovery App - Serverless Infrastructure
Parameters:
  AppName:
    Type: String
    Default: ilayaraja-app
    Description: Application name for resource naming
  AdminApiKey:
    Type: String
    NoEcho: true
    Description: Secret API key for admin endpoints
  SpotifyClientId:
    Type: String
    NoEcho: true
    Default: ''
    Description: Spotify Client ID for search API
  SpotifyClientSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Spotify Client Secret for search API
  GoogleClientId:
    Type: String
    Default: ''
    Description: Google Client ID for Admin OAuth
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Gemini API Key for dynamic song trivia
  MongoDbUri:
    Type: String
    NoEcho: true
    Description: MongoDB Atlas Connection URI
  DomainName:
    Type: String
    Default: music.uforiansports.com
    Description: Domain name for CORS
  CloudFrontPrivateKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Private key for signing CloudFront URLs
  TwitterConsumerKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Twitter Consumer Key for posting
  TwitterSecretKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Twitter Secret Key for posting
  TwitterAccessToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: Twitter Access Token for posting
  TwitterAccessTokenSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Twitter Access Token Secret for posting
  Environment:
    Type: String
    Default: production
    AllowedValues:
    - development
    - staging
    - production
    Description: Environment name
Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs20.x
    Environment:
      Variables:
        MONGODB_URI:
          Ref: MongoDbUri
        ADMIN_API_KEY:
          Ref: AdminApiKey
        DOMAIN_NAME:
          Ref: DomainName
        NODE_ENV:
          Ref: Environment
        GOOGLE_CLIENT_ID:
          Ref: GoogleClientId
        GEMINI_API_KEY:
          Ref: GeminiApiKey
        CLOUDFRONT_KEY_PAIR_ID: K32SZT30BJ9KL3
        CLOUDFRONT_PRIVATE_KEY:
          Ref: CloudFrontPrivateKey
        TWITTER_CONSUMER_KEY:
          Ref: TwitterConsumerKey
        TWITTER_SECRET_KEY:
          Ref: TwitterSecretKey
        TWITTER_ACCESS_TOKEN:
          Ref: TwitterAccessToken
        TWITTER_ACCESS_TOKEN_SECRET:
          Ref: TwitterAccessTokenSecret
Resources:
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${AppName}-api
      StageName:
        Ref: Environment
      Cors:
        AllowMethods: '''GET,POST,OPTIONS,DELETE,PUT,PATCH'''
        AllowHeaders: '''Content-Type,Authorization,x-user-id'''
        AllowOrigin: '''*'''
        MaxAge: '''3600'''
  GetSongOfDayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AppName}-get-song-of-day
      CodeUri: GetSongOfDayFunction
      Handler: lambda_functions.getSongOfDay
      Events:
        GetSongApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiGateway
            Path: /song/today
            Method: GET
      Tags:
        Environment:
          Ref: Environment
    Metadata:
      SamResourceId: GetSongOfDayFunction
